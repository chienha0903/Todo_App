apiVersion: apps/v1
kind: Deployment
metadata:
  name: todos
  namespace: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todos
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: todos
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-todo-svc 5432; do
                echo "waiting for postgres-todo..."; sleep 2;
              done
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq-svc 5672; do
                echo "waiting for rabbitmq..."; sleep 2;
              done
      containers:
        - name: todos
          image: todo-todos:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 50051
            - containerPort: 8081
              name: debug-http
          env:
            - name: APP_NAME
              value: "todo-app"
            - name: APP_TODO_PORT
              value: "50051"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_ENV
            - name: DB_TODO_DSN
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_TODO_DSN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRET
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: RABBITMQ_URL
            - name: ENABLE_DEBUG_RACE
              value: "true"
            - name: DEBUG_PORT
              value: "8081"
            - name: OTEL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OTEL_ENABLED
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_EXPORTER_OTLP_INSECURE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OTEL_EXPORTER_OTLP_INSECURE
            - name: OTEL_SERVICE_NAME
              value: "todos"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: todos-svc
  namespace: todo-app
spec:
  type: ClusterIP
  selector:
    app: todos
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc
    - port: 8081
      targetPort: 8081
      name: debug-http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: users
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-users-svc 5432; do
                echo "waiting for postgres-users..."; sleep 2;
              done
      containers:
        - name: users
          image: todo-users:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 50052
          env:
            - name: APP_NAME
              value: "users"
            - name: APP_USERS_PORT
              value: "50052"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_ENV
            - name: DB_USERS_DSN
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_USERS_DSN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRET
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: users-svc
  namespace: todo-app
spec:
  type: ClusterIP
  selector:
    app: users
  ports:
    - port: 50052
      targetPort: 50052
      name: grpc

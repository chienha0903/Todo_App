apiVersion: apps/v1
kind: Deployment
metadata:
  name: todos-consumer
  namespace: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todos-consumer
  template:
    metadata:
      labels:
        app: todos-consumer
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-todo-svc 5432; do
                echo "waiting for postgres-todo..."; sleep 2;
              done
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq-svc 5672; do
                echo "waiting for rabbitmq..."; sleep 2;
              done
      containers:
        - name: todos-consumer
          image: todo-todos-consumer:latest
          imagePullPolicy: Never
          env:
            - name: APP_NAME
              value: "todo-app"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_ENV
            - name: DB_TODO_DSN
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_TODO_DSN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRET
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: RABBITMQ_URL
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-outbox-worker
  namespace: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-outbox-worker
  template:
    metadata:
      labels:
        app: users-outbox-worker
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-users-svc 5432; do
                echo "waiting for postgres-users..."; sleep 2;
              done
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq-svc 5672; do
                echo "waiting for rabbitmq..."; sleep 2;
              done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis-svc 6379; do
                echo "waiting for redis..."; sleep 2;
              done
      containers:
        - name: users-outbox-worker
          image: todo-users-worker:latest
          imagePullPolicy: Never
          env:
            - name: APP_NAME
              value: "users"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_ENV
            - name: DB_USERS_DSN
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_USERS_DSN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRET
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: RABBITMQ_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: REDIS_URL
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"

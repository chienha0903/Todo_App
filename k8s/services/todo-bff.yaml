apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-bff
  namespace: todo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-bff
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: todo-bff
    spec:
      initContainers:
        - name: wait-for-todos
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z todos-svc 50051; do
                echo "waiting for todos service..."; sleep 2;
              done
        - name: wait-for-users
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z users-svc 50052; do
                echo "waiting for users service..."; sleep 2;
              done
      containers:
        - name: todo-bff
          image: todo-bff:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: APP_NAME
              value: "todo-bff"
            - name: APP_PORT
              value: "8080"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_ENV
            - name: TODOS_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TODOS_GRPC_ADDR
            - name: USERS_GRPC_ADDR
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: USERS_GRPC_ADDR
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRET
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: todo-bff-svc
  namespace: todo-app
spec:
  type: NodePort
  selector:
    app: todo-bff
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

name: CD

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image prefix
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/${OWNER}" >> $GITHUB_ENV
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Build and push todos service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/todos/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/todos:${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}/todos:latest

      - name: Build and push users service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/users/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/users:${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}/users:latest

      - name: Build and push todo-bff service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/todo-bff/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/todo-bff:${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}/todo-bff:latest

      - name: Build and push users-worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/users/Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/users-worker:${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}/users-worker:latest

      - name: Build and push todos-consumer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/todos/Dockerfile.consumer
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/todos-consumer:${{ env.VERSION }}
            ${{ env.IMAGE_PREFIX }}/todos-consumer:latest

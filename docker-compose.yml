services:
  # ── Databases ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: todo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_todo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  postgres-users:
    image: postgres:16-alpine
    container_name: user_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Message Broker ───────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: todo_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"     
      - "15672:15672"   
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Core Services ────────────────────────────────────────────────────────
  users:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    container_name: todo_users
    restart: unless-stopped
    ports:
      - "50052:50052"
    environment:
      APP_NAME: users
      APP_PORT: "50052"
      APP_ENV: development
      DB_USERS_DSN: "postgres://postgres:postgres@postgres-users:5432/user_db?sslmode=disable"
      JWT_SECRET: "chien-apvn-super-secret-key-2024"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      postgres-users:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  users-outbox-worker:
    build:
      context: .
      dockerfile: services/users/Dockerfile.worker
    container_name: todo_users_worker
    restart: unless-stopped
    environment:
      DB_USERS_DSN: "postgres://postgres:postgres@postgres-users:5432/user_db?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      postgres-users:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  todos:
    build:
      context: .
      dockerfile: services/todos/Dockerfile
    container_name: todo_todos
    restart: unless-stopped
    ports:
      - "50051:50051"
    environment:
      APP_NAME: todo-app
      APP_PORT: "50051"
      APP_ENV: development
      DB_TODO_DSN: "postgres://postgres:postgres@postgres:5432/todo_db?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  todos-consumer:
    build:
      context: .
      dockerfile: services/todos/Dockerfile.consumer
    container_name: todo_consumer
    restart: unless-stopped
    environment:
      DB_TODO_DSN: "postgres://postgres:postgres@postgres:5432/todo_db?sslmode=disable"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  todo-bff:
    build:
      context: .
      dockerfile: services/todo-bff/Dockerfile
    container_name: todo_bff
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: todo-bff
      APP_PORT: "8080"
      APP_ENV: development
      TODOS_GRPC_ADDR: "todos:50051"
      USERS_GRPC_ADDR: "users:50052"
      JWT_SECRET: "chien-apvn-super-secret-key-2024"
    depends_on:
      - todos
      - users

volumes:
  postgres_todo_data:
  postgres_user_data:
  rabbitmq_data:

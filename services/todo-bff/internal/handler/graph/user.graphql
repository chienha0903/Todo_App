extend type Query {
  getUser(id: ID!): User
  listUsers(page: Int, pageSize: Int): UserPage!
}

extend type Mutation {
  login(input: LoginInput!): AuthPayload!
  refreshToken(input: RefreshTokenInput!): AuthPayload!
  changePassword(input: ChangePasswordInput!): Boolean!
  updateUser(id: ID!, input: UpdateUserInput!): User!
  deleteUser(id: ID!): Boolean!
}

type User {
  id:        ID!
  email:     String!
  username:  String!
  role:      String!
  createdAt: String!
  updatedAt: String!
}

type UserPage {
  items:    [User!]!
  total:    Int!
  page:     Int!
  pageSize: Int!
}

type AuthPayload {
  accessToken:  String!
  refreshToken: String!
}

input LoginInput {
  email:    String!
  password: String!
}

input RefreshTokenInput {
  refreshToken: String!
}

input UpdateUserInput {
  email:    String
  username: String
  password: String
  role:     String
}

input ChangePasswordInput {
  currentPassword: String!
  newPassword:     String!
}
